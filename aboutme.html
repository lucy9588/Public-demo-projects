<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucy 的手帐本 - 个人简介</title>
    <link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Ma+Shan+Zheng&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg-color: #f4efdf; --paper-color: #fffaf0; --text-color: #5d5448; }
        * { box-sizing: border-box; }
        body { 
            background-color: var(--bg-color); 
            margin: 0; padding: 20px;
            font-family: 'Patrick Hand', 'Zhi+Mang+Xing', cursive;
            color: var(--text-color);
        }
        /* 手帐页面容器 */
        .page {
            max-width: 1000px; margin: 0 auto 40px;
            background-color: var(--paper-color);
            padding: 40px; border-radius: 2px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
            position: relative; border: 1px solid #dcd3bd;
        }
        /* 胶带装饰 */
        .tape {
            position: absolute; width: 120px; height: 30px;
            background: rgba(173, 216, 230, 0.5);
            top: -10px; right: 20px; transform: rotate(5deg);
            border-left: 2px dashed rgba(0,0,0,0.1); border-right: 2px dashed rgba(0,0,0,0.1);
        }
        h1 { font-size: 3rem; margin-top: 0; border-bottom: 2px dashed #dcd3bd; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        /* 拍立得效果 */
        .polaroid {
            background: white; padding: 15px 15px 40px 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); transform: rotate(-2deg);
        }
        .polaroid img { width: 100%; height: auto; display: block; filter: sepia(20%); }
        /* 地图路径感 */
        .map-path {
            margin-top: 40px; padding: 20px;
            border: 2px dashed #bdae93; border-radius: 20px;
            display: flex; justify-content: space-around; flex-wrap: wrap;
        }
        .step { text-align: center; width: 120px; }
        .step i { font-size: 2rem; color: #bdae93; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="page">
    <div class="tape"></div>
    <h1>我的成长手帐</h1>
    <div class="grid">
        <div>
            <p style="font-size: 1.2rem;">你好！我是 Lucy。</p>
            <p>我成长在一个充满自然气息的环境中，这培养了我对色彩和结构的敏感度。对我来说，设计不仅仅是像素的堆砌，更是情感的记录。</p>
            <p>这里记录了我的兴趣爱好：<br>
               🎨 水彩写生 | 📚 知识管理 | ✈️ 徒步探索</p>
        </div>
        <div class="polaroid">
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&q=80&w=600" alt="Profile">
            <p style="text-align: center; font-family: 'Ma Shan Zheng';">保持好奇心</p>
        </div>
    </div>

    <h2 style="margin-top:60px;">成长足迹</h2>
    <div class="map-path">
        <div class="step"><i class="fa-solid fa-seedling"></i><br>启程</div>
        <div class="step"><i class="fa-solid fa-pencil"></i><br>求学</div>
        <div class="step"><i class="fa-solid fa-code"></i><br>实战</div>
        <div class="step"><i class="fa-solid fa-heart"></i><br>现在</div>
    </div>
</div>

<div style="text-align:center;">
    <a href="index.html" style="color: #5d5448; text-decoration: none;">← 返回作品集主页</a>
</div>

</body>
</html>
