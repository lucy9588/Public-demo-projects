<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Scrapbook - Final Page & Dark Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Indie+Flower&display=swap" rel="stylesheet">
    <!-- 引入社交媒体图标库 Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            /* 亮模式 (默认) */
            --bg-desktop: #333641; 
            --paper-color: #FDF8E1; 
            --text-color: #5D574F;
            --dash-color: #D1C9BE;
            --nav-btn-bg: #1a1c23;
        }

        /* 暗模式样式 */
        body.dark-mode {
            --bg-desktop: #121212; 
            --paper-color: #E0E0E0; 
            --text-color: #2D2D2D;
            --dash-color: #999;
            --nav-btn-bg: #333;
        }

        body {
            background-color: var(--bg-desktop);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Indie Flower', cursive;
            transition: background-color 0.4s ease;
        }

        /* 顶部导航 */
        .top-nav {
            position: fixed;
            top: 20px;
            width: 95%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: rgba(255,255,255,0.5);
            z-index: 1000;
        }

        .controls { display: flex; gap: 10px; }
        .nav-btn {
            background: var(--nav-btn-bg);
            color: white;
            border: none;
            width: 45px;
            height: 35px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 18px;
        }

        .theme-toggle {
            cursor: pointer;
            font-size: 24px;
            transition: transform 0.3s ease;
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
        }
        .theme-toggle:hover { transform: rotate(30deg); color: white; }

        /* 纸张容器 */
        .book-container {
            width: 900px;
            height: 600px;
            position: relative;
        }

        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            background-color: var(--paper-color);
            border-radius: 12px;
            padding: 60px;
            box-sizing: border-box;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            display: none;
            text-align: center;
            transition: background-color 0.4s ease;
        }

        .page.active { display: flex; flex-direction: column; justify-content: center; align-items: center; }

        /* 最后一页专有样式 */
        .final-title {
            font-family: 'Caveat', cursive;
            font-size: 6rem;
            margin: 0;
            color: var(--text-color);
        }

        .thanks-box {
            border: 2px dashed var(--dash-color);
            border-radius: 15px;
            padding: 25px 40px;
            margin: 30px 0;
            max-width: 600px;
        }

        .thanks-box p {
            font-size: 1.5rem;
            margin: 10px 0;
            color: var(--text-color);
        }

        .social-icons {
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }

        .social-icons a {
            color: var(--text-color);
            font-size: 2.5rem;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .social-icons a:hover { transform: scale(1.2); }
    </style>
</head>
<body>

    <div class="top-nav">
        <div id="slide-info">Slide 14 of 14</div>
        <div class="controls">
            <button class="nav-btn" onclick="prev()">❮</button>
            <button class="nav-btn" onclick="next()">❯</button>
        </div>
        <!-- 亮/暗模式切换按钮 -->
        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️</button>
    </div>

    <div class="book-container">
        
        <!-- 这里可以放你之前的 1-13 页... -->
        <!-- 下面直接演示第 14 页 (最后一个页面) -->
        
        <div class="page active" id="final-page">
            <h1 class="final-title">Let's Start a New Story!</h1>
            
            <div class="thanks-box">
                <p>Thank you for walking through my growth map.</p>
                <p>Feel free to reach out to collaborate on a new creative project!</p>
            </div>

            <div class="social-icons">
                <a href="#"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fas fa-envelope"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
        </div>

    </div>

    <script>
        // 1. 切换亮暗模式逻辑
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('theme-btn');
            
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                btn.innerText = '🌙'; // 切换到月亮标识
            } else {
                btn.innerText = '☀️'; // 切换回太阳标识
            }
        }

        // 2. 翻页逻辑 (演示用)
        let current = 14; 
        function updateCounter() {
            document.getElementById('slide-info').innerText = `Slide ${current} of 14`;
        }

        function next() { if(current < 14) { current++; updateCounter(); } }
        function prev() { if(current > 1) { current--; updateCounter(); } }

    </script>
</body>
</html>
