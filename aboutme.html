<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucy's Journey - Growth Map</title>
    
    <!-- 核心 CSS：这里请确保你的文件夹里有对应的 css 文件 -->
    <link rel="stylesheet" href="aboutme_files/style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* 这里补充一些交互基础样式，确保即使外部 CSS 加载慢也不会崩坏 */
        body { background-color: #e8e2d2; margin: 0; overflow-x: hidden; }
        
        .journal-container {
            width: 90vw; max-width: 1200px; height: 85vh;
            margin: 5vh auto; perspective: 1500px;
        }

        .book {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }

        /* 模拟手帐本页面 */
        .page {
            position: absolute; width: 50%; height: 100%;
            top: 0; right: 0;
            background: #fffaf0;
            transform-origin: left;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            box-shadow: inset 3px 0px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            overflow: hidden;
        }

        /* 装饰贴图：路径指向你上传文件夹里的素材 */
        .sticker {
            position: absolute; pointer-events: none;
            z-index: 10;
        }

        .map-dotted-line {
            position: absolute; width: 100%; height: 100%;
            background-image: url('aboutme_files/map-path.png'); /* 这里会自动调用你文件夹里的素材 */
            background-repeat: no-repeat; background-size: contain;
            opacity: 0.6;
        }

        /* 翻页翻转效果 */
        .page.flipped { transform: rotateY(-180deg); }
        .page-front, .page-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; padding: 40px; box-sizing: border-box;
        }
        .page-back { transform: rotateY(180deg); background: #fdf8eb; }

        .back-home {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 100; color: #8b7355; text-decoration: none;
            font-weight: bold; border-bottom: 1px solid #8b7355;
        }
    </style>
</head>
<body>

<div class="journal-container">
    <div class="book" id="book">
        
        <!-- 第一页：封面与个人简介 -->
        <div class="page" onclick="this.classList.toggle('flipped')">
            <div class="page-front">
                <img src="aboutme_files/tape.png" class="sticker" style="top:10px; left:20%; width:100px;">
                <h1 style="font-family: 'Ma Shan Zheng', cursive; font-size: 3rem; margin-top: 50px;">Lucy 的<br>成长手帐</h1>
                <p>点击页面开启地图路径 →</p>
                <!-- 放置一张你文件夹里的个人照片 -->
                <div style="margin-top:40px; border: 8px solid white; box-shadow: 2px 2px 10px rgba(0,0,0,0.1);">
                    <img src="aboutme_files/profile.jpg" style="width:100%;" alt="Me">
                </div>
            </div>
            <div class="page-back">
                <h2 style="border-bottom: 2px dashed #ccc;">🌱 诞生与环境</h2>
                <p>这里描述你的成长环境。代码会自动读取你在 aboutme_files 里的背景底纹...</p>
                <img src="aboutme_files/sticker-tree.png" class="sticker" style="bottom:20px; right:20px; width:80px;">
            </div>
        </div>

        <!-- 第二页：兴趣与地图路径 -->
        <div class="page" onclick="this.classList.toggle('flipped')">
            <div class="page-front">
                <div class="map-dotted-line"></div>
                <h2>🎨 兴趣爱好</h2>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <span style="background:#e8f4f8; padding: 5px 15px; border-radius: 20px;">摄影</span>
                    <span style="background:#f8e8e8; padding: 5px 15px; border-radius: 20px;">设计</span>
                    <span style="background:#e8f8e8; padding: 5px 15px; border-radius: 20px;">徒步</span>
                </div>
            </div>
            <div class="page-back">
                <h2>📍 成长地图</h2>
                <p>从南方到北方的跨越，是我探索世界的起点。</p>
                <!-- 这里的地图图片指向你的文件夹 -->
                <img src="aboutme_files/world-map.png" style="width:100%; opacity: 0.8;">
            </div>
        </div>

    </div>
</div>

<a href="index.html" class="back-home">← 返回主页</a>

<!-- 核心脚本：如果你的文件夹里有 js，这里引用它 -->
<script src="aboutme_files/script.js"></script>
<script>
    // 简单的页面初始化脚本
    console.log("手帐系统已从 aboutme_files 加载资源完毕。");
</script>

</body>
</html>
