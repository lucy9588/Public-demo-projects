<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>DevOps Runner</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">

	<style>
		:root {
			--text: #26282c;
			--subtext: #626973;
			--muted: #8a9099;
			--primary: #6f7f9f;
			--primary-dark: #53627d;
			--line: rgba(111, 127, 159, 0.24);
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html {
			scroll-behavior: smooth;
		}

		body {
			min-height: 100vh;
			overflow-x: hidden;
			color: var(--text);
			font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			background-image: url('assets/css/images/bg_aboutme.jpg');
			background-size: cover;
			background-position: center;
			background-attachment: fixed;
		}

		body::before {
			content: "";
			position: fixed;
			inset: -25%;
			z-index: 0;
			pointer-events: none;
			background:
				radial-gradient(circle at 50% 8%, rgba(255, 255, 255, 0.42), transparent 24%),
				radial-gradient(circle at 18% 28%, rgba(255, 255, 255, 0.14), transparent 30%),
				radial-gradient(circle at 78% 74%, rgba(124, 141, 181, 0.10), transparent 38%);
			animation: backgroundFloat 24s ease-in-out infinite;
		}

		body::after {
			content: "";
			position: fixed;
			inset: 0;
			z-index: 0;
			pointer-events: none;
			background:
				linear-gradient(
					180deg,
					rgba(255, 255, 255, 0.05) 0%,
					rgba(255, 255, 255, 0.01) 46%,
					rgba(255, 255, 255, 0.08) 100%
				);
		}

		@keyframes backgroundFloat {
			0% {
				transform: translate3d(0, 0, 0) scale(1);
			}

			50% {
				transform: translate3d(-2.4%, -1.8%, 0) scale(1.04);
			}

			100% {
				transform: translate3d(0, 0, 0) scale(1);
			}
		}

		.cursor-light {
			position: fixed;
			width: 420px;
			height: 420px;
			border-radius: 50%;
			pointer-events: none;
			z-index: 1;
			background:
				radial-gradient(
					circle,
					rgba(255, 255, 255, 0.32),
					rgba(255, 255, 255, 0.08) 36%,
					transparent 68%
				);
			transform: translate(-50%, -50%);
			mix-blend-mode: soft-light;
			transition: opacity 0.25s ease;
		}

		.page {
			position: relative;
			z-index: 2;
			max-width: 1040px;
			margin: 0 auto;
			padding: 46px 24px 70px;
		}

		.nav {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 34px;
		}

		.nav-title {
			color: var(--muted);
			font-size: 12.5px;
			font-weight: 900;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			text-shadow:
				0 1px 0 rgba(255, 255, 255, 0.40),
				0 10px 22px rgba(34, 38, 45, 0.10);
		}

		.back-link {
			color: #2f343b;
			text-decoration: none;
			font-size: 12.5px;
			font-weight: 800;
			letter-spacing: -0.01em;
			text-shadow:
				0 1px 0 rgba(255, 255, 255, 0.42),
				0 12px 28px rgba(34, 38, 45, 0.10);
			transition: color 0.25s ease, transform 0.25s ease;
		}

		.back-link:hover {
			color: var(--primary);
			transform: translateX(-4px);
		}

		.hero {
			max-width: 760px;
			margin-bottom: 16px;
			position: relative;
		}

		.hero::before {
			content: "";
			position: absolute;
			width: 340px;
			height: 340px;
			top: -150px;
			left: -120px;
			z-index: -1;
			background:
				radial-gradient(
					circle,
					rgba(255, 255, 255, 0.54),
					rgba(124, 141, 181, 0.10) 44%,
					transparent 74%
				);
			filter: blur(12px);
		}

		.hero h1 {
			font-size: clamp(38px, 5.8vw, 58px);
			line-height: 0.98;
			font-weight: 900;
			letter-spacing: -0.065em;
			text-shadow:
				0 1px 0 rgba(255, 255, 255, 0.50),
				0 14px 36px rgba(40, 43, 48, 0.12);
		}

		.hero p {
			max-width: 520px;
			margin-top: 12px;
			color: var(--subtext);
			font-size: 14px;
			font-weight: 700;
			line-height: 1.6;
			letter-spacing: -0.01em;
			text-shadow:
				0 1px 0 rgba(255, 255, 255, 0.36),
				0 12px 30px rgba(34, 38, 45, 0.10);
		}

		.game-shell {
			position: relative;
			background: transparent;
			border: none;
			box-shadow: none;
			overflow: visible;
		}

		.game-topbar {
			position: relative;
			z-index: 2;
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 24px;
			width: 100%;
			max-width: 960px;
			margin: 0 auto 6px;
			padding: 10px 0 10px;
		}

		.rules {
			max-width: 520px;
			color: var(--subtext);
			font-size: 13px;
			font-weight: 800;
			line-height: 1.5;
			text-shadow:
				0 1px 0 rgba(255, 255, 255, 0.34),
				0 8px 20px rgba(34, 38, 45, 0.08);
		}

		.scoreboard {
			display: flex;
			flex-wrap: wrap;
			justify-content: flex-end;
			gap: 10px;
		}

		.score-pill {
			min-width: 104px;
			padding: 8px 13px;
			border-radius: 999px;
			color: #344052;
			background: rgba(255, 255, 255, 0.12);
			border: 1px solid rgba(255, 255, 255, 0.65);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			font-size: 12px;
			font-weight: 900;
			text-align: center;
			box-shadow:
				inset 0 1px 0 rgba(255, 255, 255, 0.18),
				0 8px 24px rgba(34, 38, 45, 0.04);
		}

		.score-pill span {
			display: inline-block;
			min-width: 22px;
			color: var(--primary-dark);
		}

		.canvas-wrap {
			position: relative;
			z-index: 2;
			width: 100%;
			max-width: 960px;
			margin: 0 auto;
			padding: 0;
		}

		canvas {
			width: 100%;
			height: auto;
			display: block;
			background: transparent;
			border: none;
			box-shadow: none;
			touch-action: manipulation;
		}

		.overlay {
			position: absolute;
			inset: 0;
			z-index: 5;
			display: flex;
			align-items: center;
			justify-content: center;
			pointer-events: none;
		}

		.overlay-minimal {
			text-align: center;
			pointer-events: auto;
			transform: translateY(-8px);
		}

		.overlay-title {
			font-family: 'Press Start 2P', monospace;
			font-size: clamp(18px, 2.4vw, 28px);
			line-height: 1.4;
			letter-spacing: 0.18em;
			text-transform: uppercase;
			color: #5d6068;
			text-shadow:
				0 1px 0 rgba(255, 255, 255, 0.7),
				0 8px 22px rgba(34, 38, 45, 0.08);
		}

		.overlay-actions {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 14px;
			margin-top: 20px;
			flex-wrap: wrap;
		}

		.game-btn,
		.game-link-btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			border: 0;
			cursor: pointer;
			text-decoration: none;
			transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease, background 0.22s ease;
		}

		.game-btn--primary,
		.game-link-btn--primary {
			color: #ffffff;
			background: linear-gradient(135deg, #7c8db5, #66779b);
			box-shadow:
				0 8px 18px rgba(102, 119, 155, 0.22),
				inset 0 1px 0 rgba(255, 255, 255, 0.22);
		}

		.game-link-btn--ghost {
			padding: 10px 16px;
			border-radius: 999px;
			color: #53627d;
			background: rgba(255, 255, 255, 0.76);
			border: 1px solid rgba(255, 255, 255, 0.72);
			box-shadow:
				0 6px 14px rgba(34, 38, 45, 0.05),
				inset 0 1px 0 rgba(255, 255, 255, 0.62);
			font-size: 12px;
			font-weight: 900;
		}

		.game-link-btn--ghost:hover {
			transform: translateY(-2px);
			background: rgba(255, 255, 255, 0.86);
		}

		.start-btn {
			padding: 10px 18px;
			border-radius: 999px;
			font-size: 12px;
			font-weight: 900;
			letter-spacing: -0.01em;
			animation: pulseButton 1.8s ease-in-out infinite;
		}

		.retry-circle {
			width: 56px;
			height: 56px;
			border-radius: 50%;
			position: relative;
			font-size: 24px;
			font-weight: 900;
			line-height: 1;
		}

		.retry-circle:hover,
		.start-btn:hover {
			transform: translateY(-2px);
			filter: brightness(1.03);
		}

		.retry-circle span {
			transform: translateY(-1px);
		}

		@keyframes pulseButton {
			0% {
				box-shadow:
					0 8px 18px rgba(102, 119, 155, 0.25),
					0 0 0 0 rgba(124, 141, 181, 0.22);
			}

			70% {
				box-shadow:
					0 12px 22px rgba(102, 119, 155, 0.30),
					0 0 0 8px rgba(124, 141, 181, 0);
			}

			100% {
				box-shadow:
					0 8px 18px rgba(102, 119, 155, 0.25),
					0 0 0 0 rgba(124, 141, 181, 0);
			}
		}

		.hidden {
			display: none;
		}

		.fade {
			opacity: 0;
			transform: translateY(22px);
			transition: opacity 0.8s ease, transform 0.8s ease;
		}

		.fade.show {
			opacity: 1;
			transform: translateY(0);
		}

		@media (max-width: 640px) {
			body {
				background-attachment: scroll;
			}

			.page {
				padding: 38px 16px 52px;
			}

			.nav {
				margin-bottom: 30px;
			}

			.hero {
				margin-bottom: 12px;
			}

			.hero h1 {
				font-size: clamp(34px, 11vw, 48px);
			}

			.hero p {
				font-size: 13.5px;
			}

			.game-topbar {
				flex-direction: column;
				align-items: flex-start;
				gap: 12px;
				max-width: 100%;
			}

			.canvas-wrap {
				max-width: 100%;
			}

			.rules {
				font-size: 12.5px;
			}

			.scoreboard {
				width: 100%;
				justify-content: flex-start;
			}

			.score-pill {
				min-width: 92px;
				padding: 7px 11px;
				font-size: 11.5px;
			}

			.overlay-title {
				font-size: 16px;
				letter-spacing: 0.14em;
			}

			.overlay-actions {
				gap: 10px;
				margin-top: 16px;
			}

			.retry-circle {
				width: 50px;
				height: 50px;
				font-size: 21px;
			}

			.start-btn,
			.game-link-btn--ghost {
				font-size: 11px;
				padding: 8px 14px;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			body::before,
			.start-btn {
				animation: none;
			}

			.cursor-light {
				display: none;
			}

			.fade,
			.back-link,
			.game-btn,
			.game-link-btn {
				transition: none;
			}
		}
	</style>
</head>

<body>
	<div class="cursor-light" id="cursorLight"></div>

	<main class="page">
		<nav class="nav fade">
			<div class="nav-title">Mini Game</div>
			<a class="back-link" href="index.html">← Back to Home</a>
		</nav>

		<header class="hero fade">
			<h1>DevOps Runner</h1>
			<p>Jump over alerts. Keep the platform running.</p>
		</header>

		<section class="game-shell fade" aria-label="DevOps Runner game">
			<div class="game-topbar">
				<div class="rules">
					Press Space or tap to jump.<br>
					Second tap in the air for a higher jump.
				</div>

				<div class="scoreboard">
					<div class="score-pill">Score: <span id="score">0</span></div>
					<div class="score-pill">Best: <span id="bestScore">0</span></div>
				</div>
			</div>

			<div class="canvas-wrap">
				<canvas id="gameCanvas" width="960" height="320"></canvas>

				<div class="overlay" id="startOverlay">
					<div class="overlay-minimal">
						<div class="overlay-title">Ready</div>
						<div class="overlay-actions">
							<button class="game-btn game-btn--primary start-btn" id="startButton">Start</button>
						</div>
					</div>
				</div>

				<div class="overlay hidden" id="gameOverOverlay">
					<div class="overlay-minimal">
						<div class="overlay-title">Game Over</div>
						<div class="overlay-actions">
							<button class="game-btn game-btn--primary retry-circle" id="retryButton" aria-label="Retry">
								<span>↻</span>
							</button>
							<a class="game-link-btn game-link-btn--ghost" href="index.html" id="exitButton">Exit</a>
						</div>
					</div>
				</div>
			</div>
		</section>
	</main>

	<script>
		const light = document.getElementById('cursorLight');

		document.addEventListener('mousemove', (event) => {
			light.style.left = event.clientX + 'px';
			light.style.top = event.clientY + 'px';
		});

		document.addEventListener('mouseleave', () => {
			light.style.opacity = '0';
		});

		document.addEventListener('mouseenter', () => {
			light.style.opacity = '1';
		});

		const faders = document.querySelectorAll('.fade');

		const observer = new IntersectionObserver((entries) => {
			entries.forEach((entry) => {
				if (entry.isIntersecting) {
					entry.target.classList.add('show');
				}
			});
		}, {
			threshold: 0.16
		});

		faders.forEach((element) => observer.observe(element));

		const canvas = document.getElementById('gameCanvas');
		const ctx = canvas.getContext('2d');

		const scoreEl = document.getElementById('score');
		const bestScoreEl = document.getElementById('bestScore');
		const startOverlay = document.getElementById('startOverlay');
		const gameOverOverlay = document.getElementById('gameOverOverlay');
		const startButton = document.getElementById('startButton');
		const retryButton = document.getElementById('retryButton');

		const storageKey = 'devopsRunnerBestScore';
		let bestScore = Number(localStorage.getItem(storageKey)) || 0;
		bestScoreEl.textContent = bestScore;

		const game = {
			state: 'ready',
			width: canvas.width,
			height: canvas.height,
			groundY: 245,
			speed: 4.2,
			baseSpeed: 4.2,
			gravity: 0.60,
			jumpForce: -12.6,
			score: 0,
			frame: 0,
			nextObstacleIn: 118,
			obstacles: [],
			clouds: [],
			particles: [],
			speedLines: [],
			groundDecor: []
		};

		const cat = {
			x: 82,
			y: game.groundY - 54,
			width: 56,
			height: 54,
			vy: 0,
			jumping: false,
			squash: 1,
			jumpCount: 0,
			maxJumps: 2
		};

		function random(min, max) {
			return Math.random() * (max - min) + min;
		}

		function createGroundDecor(x) {
			const roll = Math.random();

			if (roll < 0.20) {
				return {
					type: 'grass',
					x,
					size: random(5, 10)
				};
			}

			if (roll < 0.38) {
				return {
					type: 'hump',
					x,
					width: random(12, 20),
					height: random(2, 5)
				};
			}

			if (roll < 0.70) {
				return {
					type: 'dots',
					x,
					count: Math.floor(random(2, 5)),
					gap: random(3, 6)
				};
			}

			return {
				type: 'pebble',
				x,
				width: random(4, 10)
			};
		}

		function seedGroundDecor() {
			game.groundDecor = [];
			let x = random(8, 28);

			while (x < game.width + 80) {
				game.groundDecor.push(createGroundDecor(x));
				x += random(18, 44);
			}
		}

		function resetGame() {
			game.state = 'running';
			game.speed = game.baseSpeed;
			game.score = 0;
			game.frame = 0;
			game.nextObstacleIn = 118;
			game.obstacles = [];
			game.clouds = [];
			game.particles = [];
			game.speedLines = [];
			game.groundDecor = [];

			cat.y = game.groundY - cat.height;
			cat.vy = 0;
			cat.jumping = false;
			cat.squash = 1;
			cat.jumpCount = 0;

			for (let i = 0; i < 4; i++) {
				game.clouds.push({
					x: random(0, game.width),
					y: random(38, 116),
					size: random(22, 42),
					speed: random(0.12, 0.26),
					alpha: random(0.22, 0.36)
				});
			}

			seedGroundDecor();

			scoreEl.textContent = 0;
			startOverlay.classList.add('hidden');
			gameOverOverlay.classList.add('hidden');
		}

		function startGame() {
			resetGame();
		}

		function retryGame() {
			resetGame();
		}

		function jump() {
			if (game.state !== 'running') return;

			if (cat.jumpCount < cat.maxJumps) {
				if (cat.jumpCount === 0) {
					cat.vy = game.jumpForce;
				} else {
					cat.vy = game.jumpForce * 0.84;
				}

				cat.jumping = true;
				cat.jumpCount++;
				cat.squash = 0.92;

				for (let i = 0; i < 8; i++) {
					game.particles.push({
						x: cat.x + 18 + random(-6, 6),
						y: cat.y + cat.height - 4,
						vx: random(-1.3, 0.9),
						vy: random(-2.0, -0.6),
						life: random(16, 24),
						size: random(1.4, 2.8)
					});
				}
			}
		}

		function createObstacle() {
			const typeRoll = Math.random();
			const type = typeRoll > 0.52 ? 'desk' : 'catTree';

			if (type === 'desk') {
				game.obstacles.push({
					type,
					x: game.width + 30,
					y: game.groundY - 44,
					width: 66,
					height: 44,
					label: 'Ticket'
				});
			} else {
				game.obstacles.push({
					type,
					x: game.width + 30,
					y: game.groundY - 78,
					width: 46,
					height: 78,
					label: 'Alert'
				});
			}
		}

		function computeNextGap() {
			const speedFactor = Math.min(28, game.score / 24);
			let minGap = 108 - speedFactor;
			let maxGap = 182 - speedFactor * 0.8;

			minGap = Math.max(78, minGap);
			maxGap = Math.max(126, maxGap);

			let gap = random(minGap, maxGap);

			if (game.score > 180 && Math.random() < 0.18) {
				gap *= 0.78;
			}

			return gap;
		}

		function createSpeedLine() {
			game.speedLines.push({
				x: game.width + random(0, 80),
				y: random(48, game.groundY - 34),
				length: random(20, 54),
				alpha: random(0.04, 0.10),
				speed: random(7, 12)
			});
		}

		function recycleGroundDecor() {
			let farthestX = 0;

			game.groundDecor.forEach((item) => {
				if (item.x > farthestX) {
					farthestX = item.x;
				}
			});

			game.groundDecor.forEach((item) => {
				item.x -= game.speed;

				if (item.x < -36) {
					const newItem = createGroundDecor(farthestX + random(20, 48));
					Object.assign(item, newItem);
					farthestX = item.x;
				}
			});
		}

		function update() {
			if (game.state !== 'running') return;

			game.frame++;
			game.score += 1;
			game.speed = game.baseSpeed + Math.min(2.6, game.score / 980);

			scoreEl.textContent = Math.floor(game.score / 5);

			if (game.frame % 12 === 0) {
				createSpeedLine();
			}

			cat.vy += game.gravity;
			cat.y += cat.vy;
			cat.squash += (1 - cat.squash) * 0.16;

			if (cat.y >= game.groundY - cat.height) {
				cat.y = game.groundY - cat.height;
				cat.vy = 0;
				cat.jumping = false;
				cat.jumpCount = 0;

				if (game.frame % 7 === 0) {
					game.particles.push({
						x: cat.x + 16 + random(-2, 5),
						y: game.groundY + 3,
						vx: random(-0.8, 0.35),
						vy: random(-0.6, -0.1),
						life: random(8, 12),
						size: random(1, 2.2)
					});
				}
			}

			game.nextObstacleIn--;

			if (game.nextObstacleIn <= 0) {
				createObstacle();
				game.nextObstacleIn = computeNextGap();
			}

			game.obstacles.forEach((obstacle) => {
				obstacle.x -= game.speed;
			});

			game.obstacles = game.obstacles.filter((obstacle) => obstacle.x + obstacle.width > -70);

			game.clouds.forEach((cloud) => {
				cloud.x -= cloud.speed;

				if (cloud.x < -90) {
					cloud.x = game.width + random(40, 160);
					cloud.y = random(38, 116);
					cloud.size = random(22, 42);
					cloud.alpha = random(0.22, 0.36);
				}
			});

			recycleGroundDecor();

			game.particles.forEach((particle) => {
				particle.x += particle.vx;
				particle.y += particle.vy;
				particle.vy += 0.05;
				particle.life--;
			});

			game.particles = game.particles.filter((particle) => particle.life > 0);

			game.speedLines.forEach((line) => {
				line.x -= line.speed + game.speed * 0.6;
				line.alpha *= 0.987;
			});

			game.speedLines = game.speedLines.filter((line) => line.x + line.length > 0 && line.alpha > 0.02);

			checkCollision();
		}

		function checkCollision() {
			const catBox = {
				x: cat.x + 9,
				y: cat.y + 8,
				width: cat.width - 18,
				height: cat.height - 12
			};

			for (const obstacle of game.obstacles) {
				const obsBox = {
					x: obstacle.x + 7,
					y: obstacle.y + 6,
					width: obstacle.width - 14,
					height: obstacle.height - 10
				};

				const hit =
					catBox.x < obsBox.x + obsBox.width &&
					catBox.x + catBox.width > obsBox.x &&
					catBox.y < obsBox.y + obsBox.height &&
					catBox.y + catBox.height > obsBox.y;

				if (hit) {
					endGame();
					break;
				}
			}
		}

		function endGame() {
			game.state = 'over';

			const finalScore = Math.floor(game.score / 5);

			if (finalScore > bestScore) {
				bestScore = finalScore;
				localStorage.setItem(storageKey, bestScore);
				bestScoreEl.textContent = bestScore;
			}

			gameOverOverlay.classList.remove('hidden');
		}

		function drawRoundedRect(x, y, width, height, radius, fillStyle) {
			ctx.beginPath();
			ctx.moveTo(x + radius, y);
			ctx.lineTo(x + width - radius, y);
			ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
			ctx.lineTo(x + width, y + height - radius);
			ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
			ctx.lineTo(x + radius, y + height);
			ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
			ctx.lineTo(x, y + radius);
			ctx.quadraticCurveTo(x, y, x + radius, y);
			ctx.closePath();
			ctx.fillStyle = fillStyle;
			ctx.fill();
		}

		function drawBackground() {
			ctx.clearRect(0, 0, game.width, game.height);

			const sky = ctx.createLinearGradient(0, 0, 0, game.height);
			sky.addColorStop(0, 'rgba(255, 255, 255, 0.02)');
			sky.addColorStop(0.62, 'rgba(233, 236, 240, 0.01)');
			sky.addColorStop(1, 'rgba(255, 255, 255, 0.02)');
			ctx.fillStyle = sky;
			ctx.fillRect(0, 0, game.width, game.height);

			game.clouds.forEach((cloud) => {
				ctx.save();
				ctx.globalAlpha = cloud.alpha;
				ctx.fillStyle = '#ffffff';
				ctx.beginPath();
				ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
				ctx.arc(cloud.x + cloud.size * 0.72, cloud.y + 5, cloud.size * 0.66, 0, Math.PI * 2);
				ctx.arc(cloud.x - cloud.size * 0.70, cloud.y + 8, cloud.size * 0.62, 0, Math.PI * 2);
				ctx.fill();
				ctx.restore();
			});

			drawSpeedLines();

			ctx.save();
			ctx.strokeStyle = 'rgba(111, 127, 159, 0.26)';
			ctx.lineWidth = 3;
			ctx.beginPath();
			ctx.moveTo(36, game.groundY + 2);
			ctx.lineTo(game.width - 36, game.groundY + 2);
			ctx.stroke();

			ctx.strokeStyle = 'rgba(255, 255, 255, 0.56)';
			ctx.lineWidth = 1;
			ctx.beginPath();
			ctx.moveTo(36, game.groundY + 6);
			ctx.lineTo(game.width - 36, game.groundY + 6);
			ctx.stroke();

			ctx.setLineDash([3, 13]);
			ctx.lineDashOffset = -game.frame * (game.speed * 0.9);
			ctx.strokeStyle = 'rgba(95, 102, 113, 0.42)';
			ctx.lineWidth = 1.2;
			ctx.beginPath();
			ctx.moveTo(36, game.groundY + 10);
			ctx.lineTo(game.width - 36, game.groundY + 10);
			ctx.stroke();
			ctx.setLineDash([]);
			ctx.restore();

			drawGroundDecor();
		}

		function drawSpeedLines() {
			game.speedLines.forEach((line) => {
				ctx.save();
				ctx.globalAlpha = line.alpha;
				ctx.strokeStyle = 'rgba(111, 127, 159, 0.38)';
				ctx.lineWidth = 1.1;
				ctx.beginPath();
				ctx.moveTo(line.x, line.y);
				ctx.lineTo(line.x + line.length, line.y);
				ctx.stroke();
				ctx.restore();
			});
		}

		function drawGroundDecor() {
			game.groundDecor.forEach((item) => {
				if (item.type === 'grass') {
					const baseY = game.groundY + 2;

					ctx.save();
					ctx.strokeStyle = 'rgba(94, 103, 116, 0.46)';
					ctx.lineWidth = 1.2;
					ctx.lineCap = 'round';

					ctx.beginPath();
					ctx.moveTo(item.x, baseY);
					ctx.lineTo(item.x - 1.5, baseY - item.size);
					ctx.moveTo(item.x + 2.4, baseY);
					ctx.lineTo(item.x + 2.2, baseY - item.size * 0.72);
					ctx.moveTo(item.x + 5.2, baseY);
					ctx.lineTo(item.x + 6.4, baseY - item.size * 0.86);
					ctx.stroke();

					ctx.restore();
				}

				if (item.type === 'hump') {
					ctx.save();
					ctx.strokeStyle = 'rgba(95, 102, 113, 0.48)';
					ctx.lineWidth = 1.4;
					ctx.beginPath();
					ctx.moveTo(item.x, game.groundY + 2);
					ctx.quadraticCurveTo(
						item.x + item.width * 0.5,
						game.groundY + 2 - item.height,
						item.x + item.width,
						game.groundY + 2
					);
					ctx.stroke();
					ctx.restore();
				}

				if (item.type === 'pebble') {
					ctx.save();
					ctx.fillStyle = 'rgba(94, 103, 116, 0.42)';
					ctx.fillRect(item.x, game.groundY + 8, item.width, 1.4);
					ctx.restore();
				}

				if (item.type === 'dots') {
					ctx.save();
					ctx.fillStyle = 'rgba(94, 103, 116, 0.34)';

					for (let i = 0; i < item.count; i++) {
						ctx.fillRect(item.x + i * item.gap, game.groundY + 8, 1.5, 1.5);
					}

					ctx.restore();
				}
			});
		}

		function drawCat() {
			const runningOnGround = game.state === 'running' && !cat.jumping;
			const runCycle = runningOnGround ? game.frame * 0.44 : 0;
			const runBounce = runningOnGround ? Math.sin(game.frame * 0.28) * 1.6 : 0;

			const x = cat.x;
			const y = cat.y + runBounce;

			const frontStep = runningOnGround ? Math.sin(runCycle) * 5.2 : 0;
			const backStep = runningOnGround ? Math.sin(runCycle + Math.PI) * 5.2 : 0;
			const tailSwing = runningOnGround ? Math.sin(runCycle * 0.8) * 3.5 : 0;

			ctx.save();
			ctx.translate(x + cat.width / 2, y + cat.height / 2);
			ctx.scale(1, cat.squash);
			ctx.translate(-(x + cat.width / 2), -(y + cat.height / 2));

			ctx.fillStyle = 'rgba(45, 48, 54, 0.12)';
			ctx.beginPath();
			ctx.ellipse(x + 28, game.groundY + 7, 28, 7, 0, 0, Math.PI * 2);
			ctx.fill();

			ctx.strokeStyle = '#c99976';
			ctx.lineWidth = 4.4;
			ctx.lineCap = 'round';

			ctx.beginPath();
			ctx.moveTo(x + 18, y + 42);
			ctx.lineTo(x + 18 + backStep * 0.34, y + 54 - Math.abs(backStep) * 0.16);

			ctx.moveTo(x + 26, y + 42);
			ctx.lineTo(x + 26 - backStep * 0.28, y + 54 - Math.abs(backStep) * 0.12);

			ctx.moveTo(x + 37, y + 42);
			ctx.lineTo(x + 37 + frontStep * 0.34, y + 54 - Math.abs(frontStep) * 0.16);

			ctx.moveTo(x + 45, y + 42);
			ctx.lineTo(x + 45 - frontStep * 0.28, y + 54 - Math.abs(frontStep) * 0.12);
			ctx.stroke();

			ctx.fillStyle = '#d9b08c';
			ctx.beginPath();
			ctx.ellipse(x + 26, y + 31, 24, 17, 0, 0, Math.PI * 2);
			ctx.fill();

			ctx.fillStyle = '#e7c19d';
			ctx.beginPath();
			ctx.arc(x + 36, y + 16, 16, 0, Math.PI * 2);
			ctx.fill();

			ctx.beginPath();
			ctx.moveTo(x + 25, y + 8);
			ctx.lineTo(x + 31, y - 6);
			ctx.lineTo(x + 37, y + 9);
			ctx.fill();

			ctx.beginPath();
			ctx.moveTo(x + 39, y + 8);
			ctx.lineTo(x + 47, y - 5);
			ctx.lineTo(x + 50, y + 10);
			ctx.fill();

			ctx.fillStyle = '#8f6f5b';
			ctx.beginPath();
			ctx.arc(x + 31, y + 16, 2, 0, Math.PI * 2);
			ctx.arc(x + 42, y + 16, 2, 0, Math.PI * 2);
			ctx.fill();

			ctx.strokeStyle = '#8f6f5b';
			ctx.lineWidth = 1.8;
			ctx.beginPath();
			ctx.arc(x + 36, y + 22, 4.5, 0.12, Math.PI - 0.12);
			ctx.stroke();

			ctx.strokeStyle = '#d9b08c';
			ctx.lineWidth = 6;
			ctx.lineCap = 'round';
			ctx.beginPath();
			ctx.moveTo(x + 8, y + 30);
			ctx.quadraticCurveTo(
				x - 14,
				y + 14 + tailSwing,
				x + 4,
				y + 8 + tailSwing * 0.45
			);
			ctx.stroke();

			ctx.strokeStyle = '#8f6f5b';
			ctx.lineWidth = 2.2;
			ctx.beginPath();
			ctx.moveTo(x + 18, y + 15);
			ctx.lineTo(x + 12, y + 12);
			ctx.moveTo(x + 24, y + 11);
			ctx.lineTo(x + 20, y + 6);
			ctx.stroke();

			ctx.restore();
		}

		function drawDesk(obstacle) {
			const x = obstacle.x;
			const y = obstacle.y;

			drawRoundedRect(x, y, obstacle.width, 15, 6, '#b9a999');

			ctx.fillStyle = '#8d7f72';
			ctx.fillRect(x + 10, y + 15, 6, obstacle.height - 15);
			ctx.fillRect(x + obstacle.width - 16, y + 15, 6, obstacle.height - 15);

			ctx.fillStyle = 'rgba(255, 255, 255, 0.40)';
			ctx.fillRect(x + 8, y + 5, obstacle.width - 16, 2.5);

			ctx.fillStyle = '#6f7f9f';
			ctx.font = '900 10px Nunito Sans';
			ctx.fillText(obstacle.label, x + 18, y - 7);

			ctx.strokeStyle = 'rgba(83, 98, 125, 0.34)';
			ctx.lineWidth = 1.6;
			ctx.strokeRect(x + 18, y + 22, 20, 14);
		}

		function drawCatTree(obstacle) {
			const x = obstacle.x;
			const y = obstacle.y;

			ctx.fillStyle = '#9d8b7d';
			ctx.fillRect(x + 20, y + 16, 7, obstacle.height - 16);

			drawRoundedRect(x + 5, y + 12, 36, 12, 6, '#b9a999');
			drawRoundedRect(x, y + 38, 46, 12, 6, '#c7b8aa');
			drawRoundedRect(x + 8, y + 64, 34, 12, 6, '#b9a999');

			ctx.fillStyle = 'rgba(255, 255, 255, 0.38)';
			ctx.fillRect(x + 8, y + 16, 26, 2.4);
			ctx.fillRect(x + 6, y + 42, 32, 2.4);
			ctx.fillRect(x + 12, y + 68, 22, 2.4);

			ctx.fillStyle = '#6f7f9f';
			ctx.font = '900 10px Nunito Sans';
			ctx.fillText(obstacle.label, x + 7, y - 7);
		}

		function drawObstacles() {
			game.obstacles.forEach((obstacle) => {
				if (obstacle.type === 'desk') {
					drawDesk(obstacle);
				} else {
					drawCatTree(obstacle);
				}
			});
		}

		function drawParticles() {
			game.particles.forEach((particle) => {
				ctx.save();
				ctx.globalAlpha = Math.max(0, particle.life / 28);
				ctx.fillStyle = 'rgba(111, 127, 159, 0.34)';
				ctx.beginPath();
				ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
				ctx.fill();
				ctx.restore();
			});
		}

		function drawStatusText() {
			if (game.state !== 'running') return;

			ctx.save();
			ctx.fillStyle = 'rgba(69, 81, 102, 0.56)';
			ctx.font = '900 12px Nunito Sans';
			ctx.fillText('Uptime growing...', 38, 34);
			ctx.restore();
		}

		function render() {
			drawBackground();
			drawParticles();
			drawObstacles();
			drawCat();
			drawStatusText();
		}

		function loop() {
			update();
			render();
			requestAnimationFrame(loop);
		}

		startButton.addEventListener('click', startGame);
		retryButton.addEventListener('click', retryGame);

		document.addEventListener('keydown', (event) => {
			if (event.code === 'Space' || event.code === 'ArrowUp') {
				event.preventDefault();

				if (game.state === 'ready') {
					startGame();
					return;
				}

				if (game.state === 'over') {
					retryGame();
					return;
				}

				jump();
			}
		});

		document.addEventListener('pointerdown', (event) => {
			const clickedButton = event.target.closest('button');
			const clickedLink = event.target.closest('a');

			if (clickedButton || clickedLink) {
				return;
			}

			if (game.state === 'running') {
				jump();
			}
		});

		document.addEventListener('touchstart', (event) => {
			const touchedButton = event.target.closest('button');
			const touchedLink = event.target.closest('a');

			if (touchedButton || touchedLink) {
				return;
			}

			if (game.state === 'running') {
				event.preventDefault();
				jump();
			}
		}, {
			passive: false
		});

		seedGroundDecor();
		render();
		loop();
	</script>
</body>
</html>
