<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Life Scrapbook | Lucy</title>
    <!-- 引入艺术字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Patrick+Hand&family=Long+Cang&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --scrapbook-bg: #e3dcd2;
            --paper-white: #fdfaf2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--scrapbook-bg);
            font-family: 'Patrick Hand', 'Long Cang', cursive;
            overflow: hidden; /* 禁止原生滚动，由 JS 控制翻页 */
            color: #4a443c;
        }

        /* PPT 容器 */
        .slider-container {
            width: 100vw; height: 100vh;
            display: flex; transition: transform 0.8s cubic-bezier(0.6, 0, 0.2, 1);
        }

        /* 单个 PPT 页面 */
        .slide {
            min-width: 100vw; height: 100vh;
            position: relative; padding: 5vw;
            background-image: url('aboutme_files/paper-texture.png'); /* 纸张底纹 */
            background-size: cover;
            display: flex; align-items: center; justify-content: center;
        }

        /* 手帐内容区 */
        .content-box {
            width: 80%; height: 80%;
            background: var(--paper-white);
            box-shadow: 20px 20px 60px rgba(0,0,0,0.05), -10px -10px 40px rgba(255,255,255,0.5);
            border-radius: 5px; position: relative;
            padding: 40px; overflow: hidden;
        }

        /* 装饰元素 - 胶带 */
        .washi-tape {
            position: absolute; width: 150px; height: 40px;
            background: rgba(189, 195, 199, 0.4);
            z-index: 10; opacity: 0.8;
            border-left: 2px dashed rgba(0,0,0,0.05);
            border-right: 2px dashed rgba(0,0,0,0.05);
        }

        /* 拍立得照片效果 */
        .polaroid {
            background: white; padding: 15px 15px 60px 15px;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.1);
            transform: rotate(-3deg); max-width: 300px;
            position: absolute;
        }
        .polaroid img { width: 100%; height: auto; display: block; }

        /* 导航按钮 */
        .nav-btn {
            position: fixed; bottom: 30px; right: 50px;
            z-index: 100; display: flex; gap: 20px;
        }
        .btn {
            width: 50px; height: 50px; border-radius: 50%;
            background: white; border: none; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s; color: #8b7355;
        }
        .btn:hover { background: #8b7355; color: white; transform: scale(1.1); }

        /* 返回主页 */
        .home-link {
            position: fixed; top: 30px; left: 40px; z-index: 100;
            text-decoration: none; color: #8b7355; font-weight: bold;
            font-size: 1.2rem; border-bottom: 2px solid #8b7355;
        }

        /* 文字排版 */
        h1 { font-size: 4rem; color: #5d5448; margin-bottom: 20px; line-height: 1; }
        p { font-size: 1.5rem; line-height: 1.6; max-width: 500px; }

        /* 手帐贴图动态效果 */
        .sticker { position: absolute; transition: transform 0.5s; cursor: pointer; }
        .sticker:hover { transform: scale(1.2) rotate(10deg); }
    </style>
</head>
<body>

    <a href="index.html" class="home-link">← Gallery</a>

    <div class="slider-container" id="slider">
        
        <!-- Slide 1: 封面 -->
        <section class="slide">
            <div class="content-box">
                <div class="washi-tape" style="top: -10px; left: 30%; transform: rotate(-5deg); background: #d4e6f1;"></div>
                <div class="polaroid" style="right: 10%; top: 15%; transform: rotate(5deg);">
                    <img src="aboutme_files/cover-photo.jpg" alt="Cover">
                    <p style="text-align:center; font-size: 1rem; margin-top:10px;">My Journey 2026</p>
                </div>
                <div style="margin-top: 100px;">
                    <span style="background: #fcf3cf; padding: 5px 15px;">Welcome to My Life</span>
                    <h1>Lucy's <br>Scrapbook</h1>
                    <p>这是一个关于成长、设计与生活碎片的小世界。</p>
                </div>
                <img src="aboutme_files/leaf.png" class="sticker" style="bottom: 20px; left: 20px; width: 120px;">
            </div>
        </section>

        <!-- Slide 2: 成长环境 (地图路径) -->
        <section class="slide">
            <div class="content-box">
                <div class="washi-tape" style="top: -5px; right: 20%; transform: rotate(3deg); background: #f5b7b1;"></div>
                <h2>成长足迹</h2>
                <div style="display: flex; margin-top: 50px; gap: 50px; align-items: center;">
                    <div style="flex: 1;">
                        <p>我出生于一个[填入环境]，那里的一草一木都影响了我后来的审美...</p>
                        <img src="aboutme_files/map-line.png" style="width: 100%; margin-top: 20px;" alt="Path">
                    </div>
                    <div class="polaroid" style="position: relative; transform: rotate(2deg);">
                        <img src="aboutme_files/hometown.jpg" alt="Hometown">
                    </div>
                </div>
                <img src="aboutme_files/star.png" class="sticker" style="top: 40px; right: 50px; width: 60px;">
            </div>
        </section>

        <!-- Slide 3: 爱好与灵魂 -->
        <section class="slide">
            <div class="content-box" style="background-image: radial-gradient(#dcd3bd 1px, transparent 1px); background-size: 20px 20px;">
                <h1>Hobbies</h1>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px;">
                    <div style="background: white; padding: 20px; border: 1px solid #eee;">
                        <h3>🎨 Design</h3>
                        <p>设计是我观察世界的方式。</p>
                    </div>
                    <div style="background: white; padding: 20px; border: 1px solid #eee;">
                        <h3>⛰️ Trekking</h3>
                        <p>在自然中寻找灵感。</p>
                    </div>
                </div>
                <!-- 拼贴贴图 -->
                <img src="aboutme_files/sticker-1.png" class="sticker" style="bottom: 50px; right: 100px; width: 100px;">
                <img src="aboutme_files/sticker-2.png" class="sticker" style="top: 20px; right: 20px; width: 80px;">
            </div>
        </section>

    </div>

    <!-- PPT 导航按钮 -->
    <div class="nav-btn">
        <button class="btn" onclick="moveSlide(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="btn" onclick="moveSlide(1)"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <script>
        let currentSlide = 0;
        const slider = document.getElementById('slider');
        const totalSlides = document.querySelectorAll('.slide').length;

        function moveSlide(direction) {
            currentSlide += direction;
            if (currentSlide >= totalSlides) currentSlide = 0;
            if (currentSlide < 0) currentSlide = totalSlides - 1;
            
            slider.style.transform = `translateX(-${currentSlide * 100}vw)`;
        }

        // 监听键盘左右方向键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') moveSlide(1);
            if (e.key === 'ArrowLeft') moveSlide(-1);
        });
    </script>
</body>
</html>
